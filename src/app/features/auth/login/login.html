<div class="login-wrapper">
  <div class="login-card">

    <div class="header">
      <h1 class="brand-title">Artela</h1>
      <p class="brand-subtitle">Backoffice Sign In</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="onSubmit()">

      <div class="form-group">
        <label for="username">Username</label>
        <div class="input-wrapper">
          <input
            id="username"
            type="text"
            formControlName="username"
            placeholder="Masukkan username anda"
            autocomplete="off">
        </div>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="input-wrapper">
          <input
            id="password"
            type="password"
            formControlName="password"
            placeholder="Masukkan password">
        </div>
      </div>

      @if (errorMessage) {
        <div class="error-message">
          {{ errorMessage }}
        </div>
      }

      <button type="submit" class="btn-login" [disabled]="form.invalid || isLoading">
        @if (isLoading) {
          <span class="loading-dots">Memproses...</span>
        } @else {
          <span>Masuk</span>
        }
      </button>

    </form>

    <div class="footer">
      <p>&copy; 2025 Artela Digital Invitation</p>
    </div>
  </div>
</div>
